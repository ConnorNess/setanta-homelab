services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    env_file:
      - .env

    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

    volumes:
      - ./gluetun:/gluetun

    restart: unless-stopped

    networks:
      - media

networks:
  media:
    external: true
