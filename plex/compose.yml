services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London

    volumes:
      - ./config:/config
      - ./transcode:/transcode
      - ${MEDIA_PATH}:/media

    restart: unless-stopped
