services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr

    init: true

    environment:
      - TZ=Europe/London
      - LOG_LEVEL=info
      - PORT=5055

    volumes:
      - ./config:/app/config

    ports:
      - "5055:5055"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - media

networks:
  media:
    external: true
