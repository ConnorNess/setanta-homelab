services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London

    volumes:
      - ./config:/config

    ports:
      - "9696:9696"

    restart: unless-stopped

    networks:
      - media

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  media:
    external: true
